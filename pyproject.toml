[project]
name = "otimizacao-de-receita"
version = "2.0.0"
description = "Modelo prescritivo de preço e desconto por quantidade/época para maximizar receita (case de portfólio)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Flávio Henrique Barbosa" }]
keywords = ["data-science", "revenue-optimization", "pricing", "crisp-dm", "mlops"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.2,<3",
  "scikit-learn>=1.4,<1.6",
  "scipy>=1.11,<1.15",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14",
  "xgboost>=2.0,<3",
  "openpyxl>=3.1,<4",
  "pyarrow>=16.0",
  "mlflow>=2.12,<3",
  "dagshub>=0.3,<0.4",
  "shap>=0.45,<0.47",
  "streamlit>=1.36,<2",
  "onnx>=1.16,<2",
  "skl2onnx>=1.16,<2",
  "onnxmltools>=1.12,<2",
]

[project.optional-dependencies]
# Ferramentas pontuais de geração de assets (badges/SVG -> PNG).
assets = ["cairosvg>=2.7,<3"]

[dependency-groups]
# Autoria de notebooks e ferramentas de desenvolvimento local.
dev = [
  "jupyterlab>=4.2,<5",
  "ipykernel>=6.29,<7",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<1",
  "nbconvert>=7.16,<8",
  "ruff>=0.6,<0.9",
  "black>=24.4,<25",
  "pre-commit>=3.7,<4",
]
# Suíte de testes (usada na CI).
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=5.0,<7",
]
# Pipeline de dados/versionamento.
mlops = [
  "dvc>=3.51,<4",
]

[tool.uv]
# Projeto aplicação: não é um pacote instalável.
package = false

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "notebooks", "docs", "report"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.black]
line-length = 88
target-version = ["py311"]
extend-exclude = '/(\.venv|notebooks|docs|report)/'

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
