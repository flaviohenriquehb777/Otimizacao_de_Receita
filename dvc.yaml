stages:
  gerar_dados:
    desc: Gera o dataset canônico calibrado (Parquet) a partir do dossiê de negócio.
    cmd: python -m src.data.gerar_dataset
    deps:
      - src/data/gerar_dataset.py
      - src/config/paths.py
    outs:
      - dados/dataset_cafeterias_rj.parquet

  preparar_dados:
    desc: Valida a base bruta, deriva features leakage-safe e materializa o split temporal.
    cmd: python -m src.data.preparar_dataset
    deps:
      - src/data/preparar_dataset.py
      - src/config/paths.py
      - dados/dataset_cafeterias_rj.parquet
    outs:
      - dados/dataset_cafeterias_rj_preparado.parquet

  train:
    desc: Treina o modelo de demanda, escolhe o desconto ótimo e publica os artefatos.
    cmd: python -m src.modeling.train_pipeline
    deps:
      - src/modeling/train_pipeline.py
      - src/data/preparar_dataset.py
      - src/config/paths.py
      - dados/dataset_cafeterias_rj_preparado.parquet
    outs:
      - models/best_model.pkl
      - models/metrics_snapshot.json
      - models/model_card.json
      - models/business_curve.csv
      - models/test_predictions.parquet
