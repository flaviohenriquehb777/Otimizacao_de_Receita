name: MLOps — Retreinar e publicar

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retrain-publish:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Instalar dependências (uv sync)
        run: uv sync --frozen --all-groups

      - name: Gerar dataset determinístico
        run: |
          uv run python -m src.data.gerar_dataset
          uv run python -m src.data.preparar_dataset

      - name: Treinar e publicar artefatos
        run: uv run python -m src.modeling.train_pipeline

      - name: Resumo do treino (métricas do teste)
        run: |
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          snap = json.loads(
              Path("models/metrics_snapshot.json").read_text(encoding="utf-8")
          )
          teste = snap["teste"]
          linhas = [
              "## Treino — resumo",
              "",
              f"- Campeão: {snap['modelo']}",
              f"- RMSE (teste): {teste['rmse']:.3f}",
              f"- MAE (teste): {teste['mae']:.3f}",
              f"- R² (teste): {teste['r2']:.3f}",
              f"- Uplift: {teste['uplift_pct']:.2f}%",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(linhas) + "\n")
          PY

      - name: Commitar artefatos publicados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/artifacts docs
          if git diff --cached --quiet; then
            echo "Sem mudanças nos artefatos publicados."
          else
            git commit -m "chore(mlops): republica artefatos do treino"
            git push
          fi
